services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      ACCOUNT: "${QQ_ACCOUNT}"
      WSR_ENABLE: "true"
      WS_URLS: '["ws://bot:8080/onebot/v11/ws"]'
    ports:
      - "6099:6099"   # NapCat WebUI：http://<服务器IP>:6099
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    depends_on:
      - bot

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: wm-bot
    restart: unless-stopped
    env_file:
      - bot/.env
    environment:
      WM_PROXY: "${WM_PROXY:-}"
    volumes:
      - ./data:/app/data
      - ./wm_helper:/app/wm_helper
      - wm_cache:/app/.cache

volumes:
  wm_cache:
